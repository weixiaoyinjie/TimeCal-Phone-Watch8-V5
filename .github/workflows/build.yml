name: Build TimeCal Phone and Wear
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Find project (supports a single uploaded ZIP)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f settings.gradle ]; then
            archive=$(find . -maxdepth 2 -type f -name 'TimeCal_V5_Source.zip' -print -quit)
            test -n "$archive"
            unzip -oq "$archive" -d "$RUNNER_TEMP/timecal"
            project=$(find "$RUNNER_TEMP/timecal" -name settings.gradle -print -quit)
            test -n "$project"
            echo "PROJECT_DIR=$(dirname "$project")" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          if [[ ! -f "$sdk/platforms/android-35/android.jar" || ! -x "$sdk/build-tools/35.0.0/aapt2" ]]; then
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            test -x "$manager"
            set +o pipefail
            yes | "$manager" --sdk_root="$sdk" --licenses >/dev/null
            set -o pipefail
            "$manager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build both APKs using one debug key
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug :wear:assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/apks"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apks/TimeCal_PHONE.apk"
          cp wear/build/outputs/apk/debug/wear-debug.apk "$GITHUB_WORKSPACE/apks/TimeCal_WEAR.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TimeCal-Phone-Wear
          path: apks/*.apk
